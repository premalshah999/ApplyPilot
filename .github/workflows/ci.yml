name: Verify application
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.18'
          python-version: '3.12'
      - run: npm ci && npm run build
        working-directory: frontend
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check jobpilot tests && uv run ruff format --check jobpilot tests
      - run: uv run pytest -q
      - name: Build production image
        run: docker build -t applypilot:ci .
